# Publish the SDK when a GitHub Release is published (NOT on PR merge).
#
# Flow: draft a Release with a tag like `v0.1.0`. This workflow verifies the tag matches the version
# anchor mirrored in all four sources, rebuilds + tests both stacks, then publishes:
#   - @mosaicast/plugin-sdk → npm (OIDC trusted publishing, with provenance)
#   - plugin-api + plugin-testkit → Maven Central (Central Portal), signed; the deployment waits in the
#     Portal for a person to publish it (manual release — a Central release is permanent)
#   - plugin-api + plugin-testkit → GitHub Packages (Maven), kept while plugins move to mavenCentral()
#
# The version anchor is the source of truth; the tag must equal it. Bump with scripts/set-version.sh.
name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify tag == version anchor
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Assert tag matches the mirrored version
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_v="${TAG#v}"   # strip an optional leading 'v'
          gradle_v=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts | head -1)
          npm_v=$(node -p "require('./package.json').version")
          java_v=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' plugin-api/src/main/java/dev/mosaicast/plugin/api/PlatformApi.java)
          ts_v=$(grep -oP "PLATFORM_API_VERSION\s*=\s*'\K[^']+" src/index.ts)
          echo "tag=$tag_v gradle=$gradle_v npm=$npm_v java=$java_v ts=$ts_v"
          for v in "$gradle_v" "$npm_v" "$java_v" "$ts_v"; do
            if [ "$v" != "$tag_v" ]; then
              echo "::error::Release tag '$TAG' ($tag_v) does not match version anchor '$v'. Bump all four with scripts/set-version.sh and re-tag."
              exit 1
            fi
          done
          echo "version=$tag_v" >> "$GITHUB_OUTPUT"
          echo "All sources aligned at $tag_v ✅"

  publish-npm:
    name: Publish @mosaicast/plugin-sdk to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'   # npm 11/12 require Node >= 22 (npm@latest dropped Node 20)
          registry-url: 'https://registry.npmjs.org'
          scope: '@mosaicast'
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11   # pinned major: OIDC/provenance needs npm >= 11.5; avoids npm@latest engine churn

      - name: Install, build, test
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish (OIDC, public, with provenance; skip if already on npm)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@mosaicast/plugin-sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "@mosaicast/plugin-sdk@${VERSION} already published — skipping (idempotent)."
          else
            npm publish --provenance --access public
          fi

  publish-maven:
    name: Publish Java artifacts to Maven Central and GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GitHub Packages
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # See ci.yml: v6 caching is a proprietary component under Gradle's Terms of Use, and it is not
          # loaded when caching is disabled. This job holds the signing key and the Central token, so it is
          # the last place to add a dependency we haven't chosen deliberately.
          cache-disabled: true

      - name: Build + test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish to GitHub Packages (skip if this version is already there)
        # First, so the channel plugins use today does not depend on the newer Central path.
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub Packages rejects re-publishing an existing release version (409), so a re-run of a
          # partially-succeeded release would fail. Guard: if both artifacts already exist, skip.
          published() {
            gh api "/orgs/Mosaicast/packages/maven/dev.mosaicast.$1/versions" -q '.[].name' 2>/dev/null \
              | grep -qx "$VERSION"
          }
          if published plugin-api && published plugin-testkit; then
            echo "Java $VERSION already on GitHub Packages — skipping (idempotent)."
          else
            ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon --stacktrace
          fi

      - name: Upload to Maven Central (skip if this version is already on Central)
        env:
          # GitHub stores secret names upper-cased; Gradle reads ORG_GRADLE_PROJECT_<property> case-sensitively.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
        run: |
          set -euo pipefail
          # A Central release is permanent: a version that is already there is never uploaded again.
          on_central() {
            curl -sfI "https://repo1.maven.org/maven2/dev/mosaicast/$1/${VERSION}/$1-${VERSION}.pom" >/dev/null
          }
          if on_central plugin-api && on_central plugin-testkit; then
            echo "Java ${VERSION} already on Maven Central — skipping the upload (idempotent)."
            exit 0
          fi
          # Uploads and validates a deployment, signed; it is NOT released (automaticRelease = false).
          ./gradlew publishToMavenCentral --no-daemon --stacktrace
          {
            echo "### Maven Central: deployment uploaded, waiting for you"
            echo "plugin-api and plugin-testkit ${VERSION} are uploaded and validated but **not published**."
            echo "Check them at https://central.sonatype.com/publishing/deployments, then **Publish** or **Drop**."
            echo "Publishing is permanent; Central takes 10–30 minutes to serve the files afterwards."
          } >> "$GITHUB_STEP_SUMMARY"
